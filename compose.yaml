services:
  llm:
    build: ./docker/llm
    image: ai-server-llm
    restart: unless-stopped
    environment:
      THREADS: ${THREADS:-2}
      CTX_SIZE: ${CTX_SIZE:-8192}
      PARALLEL: ${PARALLEL:-1}
    volumes:
      - models:/models
    secrets:
      - api_keys
    # Sem "ports": o llm só é acessível pelo Caddy.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${LLM_MEM_LIMIT:-8g}

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      - llm
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

secrets:
  api_keys:
    file: ./secrets/api-keys

volumes:
  models:
  caddy_data:
  caddy_config:
